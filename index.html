<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chemie Mibaso</title>
<meta name="description" content="Chemie zum Anfassen: Lernpfade mit Versuchen, Rätseln, Laborpass und Urkunde – ideal für Vertretungsstunden.">
<meta name="theme-color" content="#1E5C6C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chemie">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: wie media.mibaso.de – Kopfbanner, Cremegrund, eine Spalte (max. 720px); Laborpass nach dem Vorbild des Forscherpasses von bio.mibaso.de */
:root{
  --petrol:#2C7D90; --petrol-tief:#1E5C6C; --petrol-hell:#A8D4DD;
  --creme:#F7F3E8; --creme-tief:#EEE7D5; --tile:#FFFFFF;
  --honig:#C28A3A; --ink:#33302B; --ink-soft:#6A645B; --linie:#E3D8C4;
  --ok:#3B8A5A; --bad:#B23B2E;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--petrol-tief);-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;min-height:100%}
a{color:var(--petrol-tief)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honig);outline-offset:2px}
sub,sup{font-size:.7em;line-height:0}
h1,h2,h3{font-weight:normal;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.huelle{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

/* Kopfbanner wie media.mibaso.de */
.app-head{background:linear-gradient(180deg,var(--petrol-tief) 0%,var(--petrol) 100%);color:var(--creme);text-align:center;
  padding-block:26px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:4px double var(--petrol-hell)}
.app-head .logo{width:64px;height:64px;margin:0 auto 10px;display:block;border-radius:16px;background:var(--creme);padding:6px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.app-head h1{font-size:clamp(28px,8vw,40px);letter-spacing:.02em}
.app-head .untertitel{font-style:italic;color:#e0eff2;margin-top:8px;font-size:clamp(13px,3.6vw,16px)}

/* Unterseiten-Kopf */
.subkopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--creme);border-bottom:1px solid var(--linie);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--creme)}
.subkopf .row{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.zurueck{font-family:var(--sans);font-size:15px;text-decoration:none;color:var(--petrol-tief);padding:6px 4px}
.tchip{font-family:var(--sans);font-size:14px;background:var(--tile);border:1px solid var(--linie);border-radius:999px;padding:5px 12px;color:var(--petrol-tief);font-variant-numeric:tabular-nums;white-space:nowrap}

section{padding-top:26px;display:grid;gap:14px}
h2{font-size:25px}
h2::after{content:"";display:block;width:46px;height:3px;margin-top:8px;background:currentColor;border-radius:2px}
.h-petrol{color:var(--petrol)} .h-honig{color:var(--honig)}
h3{font-size:19px;color:var(--petrol-tief)}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.lead{font-size:19px}
.prose{display:grid;gap:12px}
.klein{font-size:15px;color:var(--ink-soft)}
ul.clean,ol.clean{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* Kacheln / Expeditionen */
.kacheln{display:grid;gap:12px}
.kachel{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--tile);border:1px solid var(--linie);
  border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 4px rgba(30,92,108,.06);transition:transform .08s,box-shadow .08s}
a.kachel:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(30,92,108,.12)}
.kachel .ke{font-size:30px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--creme-tief)}
.kachel .kt{font-size:18px;color:var(--petrol-tief);display:block;font-weight:bold}
.kachel .kb{font-size:14px;color:var(--ink-soft);font-family:var(--sans)}
.kachel .pf{font-size:24px;color:var(--petrol)}
.kachel.bald{opacity:.6;box-shadow:none}
.kachel.bald .pf{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}

/* Umschalter Spielmodus */
.schalter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--sans);font-size:14px}
.schalter .lab{color:var(--ink-soft);margin-right:4px}
.sbtn{border:1px solid var(--linie);background:var(--tile);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink-soft)}
.sbtn.an{background:var(--petrol);border-color:var(--petrol);color:#fff}
.hint{font-family:var(--sans);font-size:13px;color:var(--ink-soft)}

/* Laborpass-Bühne */
.buehne{position:relative;background:linear-gradient(180deg,#fff 0%,var(--creme-tief) 100%);border:1px solid var(--linie);border-radius:16px;padding:68px 12px 10px;display:grid;place-items:center;overflow:hidden}
.buehne svg{width:min(230px,60vw);height:auto;display:block}
.buehne .tisch{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#fff 0 38px,var(--linie) 38px 40px);border-top:1px solid var(--linie)}
.rangchip{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:6px 10px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);max-width:48%}
.rangchip .med{font-size:24px}
.rangchip b{display:block;font-size:14px;color:var(--petrol-tief)}
.zaehler{position:absolute;right:12px;top:12px;background:var(--petrol);color:#fff;border-radius:12px;padding:6px 12px;font-family:var(--sans);font-size:15px;font-variant-numeric:tabular-nums}
.fbalken{height:10px;background:var(--creme-tief);border-radius:5px;overflow:hidden;border:1px solid var(--linie)}
.fbalken i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e4402f,#f6ad2e,#c9d43a,#6fbf4a);transition:width .8s}
.naechster{text-align:center;font-size:16px;color:var(--ink-soft)}
.blase{animation:blase 2.4s infinite ease-in;opacity:0}
@keyframes blase{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-60px);opacity:0}}

/* Stationen */
.stationen{display:grid;gap:10px}
.station{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.station .nr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--creme-tief);font-size:22px}
.station .st{font-size:17px;color:var(--petrol-tief);font-weight:bold;display:block}
.station .sk{font-size:14px;color:var(--ink-soft);font-family:var(--sans)}
.station .stand{font-family:var(--sans);font-size:13px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.station.aktiv{border-color:var(--petrol-hell);box-shadow:0 0 0 2px var(--petrol-hell)}
.station.fertig .nr{background:#e3f0e7}
.station.gesperrt{opacity:.55}
.tropfen{letter-spacing:1px;font-size:16px}
.tropfen .leer{opacity:.22;filter:grayscale(1)}

.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.abz{background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:10px 6px;text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-soft);display:grid;gap:4px;justify-items:center}
.abz .em{font-size:28px}
.abz.zu .em{filter:grayscale(1);opacity:.25}
.abz.auf{border-color:var(--honig);color:var(--ink)}

/* Bausteine im Inhalt */
.merke{border:1.5px dashed var(--petrol);border-radius:12px;padding:14px 16px;display:grid;gap:8px;background:#fbfdfd}
.merke .eyebrow{color:var(--petrol-tief)}
.gefahr{border-left:5px solid var(--honig);background:#fbf1e2;padding:12px 14px;border-radius:0 12px 12px 0;font-size:16px}
.gefahr b{color:#8a5a17}
.box{background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:16px;display:grid;gap:12px}
.box > .eyebrow{color:var(--petrol-tief)}
.eq{font-size:18px;text-align:center;padding:10px;background:var(--creme-tief);border-radius:10px;overflow-x:auto}
details{background:var(--creme-tief);border-radius:10px;padding:10px 14px}
details summary{cursor:pointer;color:var(--petrol-tief);font-family:var(--sans);font-size:15px}
details[open] summary{margin-bottom:8px}
details .grid{display:grid;gap:8px}

/* Clips */
figure.clip{margin:0;background:var(--tile);border:1px solid var(--linie);border-radius:14px;overflow:hidden}
.clip-v{position:relative;background:#000}
.clip-v video{display:block;width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover}
.stumm{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.88);border-radius:999px;padding:3px 10px;font-family:var(--sans);font-size:12px;color:var(--ink)}
figure.clip figcaption{padding:12px 14px;display:grid;gap:8px;font-size:16px}
figure.clip figcaption b{color:var(--petrol-tief)}

/* Knöpfe */
.knopf{display:inline-block;border:1px solid var(--petrol);background:var(--tile);color:var(--petrol-tief);border-radius:12px;padding:10px 16px;font-family:var(--sans);font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.knopf.prim{background:var(--petrol);color:#fff;box-shadow:0 2px 0 var(--petrol-tief)}
.knopf.prim:hover{background:var(--petrol-tief)}
.knopf.honig{background:var(--honig);border-color:var(--honig);color:#fff;box-shadow:0 2px 0 #8a5a17}
.knopf:disabled{opacity:.4;cursor:default}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Chips / Sortieren */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--linie);background:var(--creme);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:16px;font-family:var(--serif)}
.chip.sel{border-color:var(--petrol);box-shadow:0 0 0 2px var(--petrol) inset;background:#fff}
.chip.ok{border-color:var(--ok);color:var(--ok);cursor:default;background:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed var(--linie);border-radius:12px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--creme)}
.bin h4{margin:0;font-weight:normal;font-size:17px}
.bin.g{border-color:#e5c79b} .bin.g h4{color:#8a5a17}
.bin.h{border-color:#b9d8c4} .bin.h h4{color:var(--ok)}
.feedback{min-height:1.5em;font-size:16px;color:var(--ink-soft)}
.feedback.good{color:var(--ok)} .feedback.bad{color:var(--bad)}

/* Steckbrief-Karten */
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.karte{min-height:120px;border:1px solid var(--linie);border-radius:14px;background:var(--tile);padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start}
.karte .kk{font-size:18px;color:var(--petrol-tief)}
.karte .kr{font-size:15px;color:var(--ink-soft)}
.karte.offen{background:#eef7f9;border-color:var(--petrol-hell)}
.karte .tipp{font-family:var(--sans);font-size:12px;color:var(--petrol)}

/* pH-Skala */
.ph-scale{display:grid;grid-template-columns:repeat(15,1fr);height:46px;border-radius:10px;overflow:hidden}
.ph-scale span{display:flex;align-items:flex-end;justify-content:center;font-family:var(--sans);font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);padding-bottom:3px;font-variant-numeric:tabular-nums}
.ph-marker{position:relative;height:16px}
.ph-marker i{position:absolute;top:0;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:13px solid var(--ink);transform:translateX(-9px);transition:left .35s}
.ph-out{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ph-drop{width:54px;height:54px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);transition:background .35s;border:2px solid rgba(0,0,0,.12)}
.ph-val{font-size:20px;color:var(--petrol-tief)}
.ph-achse{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:var(--ink-soft)}

/* Quiz */
.quiz{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--creme-tief);border:1px solid var(--linie)}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.bad{background:var(--bad);border-color:var(--bad)} .dots i.now{background:var(--petrol);border-color:var(--petrol)}
.qq{font-size:20px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{text-align:left;background:var(--creme);border:1px solid var(--linie);border-radius:12px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;font-size:17px}
.ans b{color:var(--petrol);font-family:var(--sans);font-weight:normal}
.ans.ok{border-color:var(--ok);background:#e3f0e7}
.ans.bad{border-color:var(--bad);background:#f6e1de}
.ans:disabled{cursor:default}
.jokers{display:flex;gap:8px;flex-wrap:wrap}
.publikum{font-style:italic;color:var(--ink-soft);border-left:3px solid var(--honig);padding-left:12px}
.ergebnis{text-align:center;display:grid;gap:10px;justify-items:center}
.ergebnis .gross{font-size:40px;letter-spacing:4px}

/* Feier, Toast, Konfetti, Urkunde */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(30,40,45,.55);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.feierkarte{background:var(--tile);border-radius:18px;padding:24px 20px;max-width:420px;width:100%;text-align:center;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.feierkarte .fmed{font-size:64px;animation:pop .6s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-family:var(--sans);font-size:15px;z-index:60;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.zeigen{transform:translateX(-50%) translateY(0)}
.konffeld{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.konf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 3.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.urkunde{background:#fffdf7;max-width:640px;width:100%;border-radius:6px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.rahmen{border:3px double var(--petrol);outline:1px solid var(--honig);outline-offset:-10px;padding:26px 22px;text-align:center;display:grid;gap:8px;justify-items:center}
.urk-eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.urk-med{font-size:56px}
.urk-titel{font-size:44px;color:var(--petrol-tief);letter-spacing:.06em}
.urk-sub{font-size:18px;color:var(--honig)}
.urk-satz{font-size:17px}
.urk-name{font:inherit;font-size:26px;text-align:center;border:0;border-bottom:1.5px solid var(--ink-soft);background:transparent;width:min(100%,380px);padding:4px;color:var(--ink)}
.urk-name-druck{display:none;font-size:26px;border-bottom:1.5px solid var(--ink-soft);min-width:300px;padding:4px}
.urk-tab{width:100%;max-width:440px;border-collapse:collapse;font-size:15px;margin-top:6px}
.urk-tab td{padding:4px 6px;border-bottom:1px solid var(--linie);text-align:left}
.urk-tab td:last-child{text-align:right;white-space:nowrap}
.urk-summe{font-size:17px;color:var(--petrol-tief)}
.urk-album{font-size:24px;letter-spacing:4px}
.urk-fuss{display:flex;justify-content:space-between;width:100%;font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:12px;gap:10px;flex-wrap:wrap}
.urk-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

.lehrer{background:var(--tile);border:1px solid var(--linie);border-radius:14px}
.lehrer summary{font-size:16px}
.reset{display:grid;gap:8px;justify-items:center;text-align:center}

footer.fuss{border-top:1px solid var(--linie);margin-top:34px;padding-top:18px;text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft);display:grid;gap:6px}


/* Säure-Regal */
.regal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flasche{display:grid;gap:6px;justify-items:center}
.slot{width:100%;min-height:40px;border:2px dashed var(--linie);border-radius:8px;background:var(--creme);cursor:pointer;font-size:14px;padding:4px;color:var(--ink-soft);font-family:var(--serif)}
.slot.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:#fff;cursor:default}
.slot-hint{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.glas{width:78%;max-width:110px;aspect-ratio:3/4;position:relative;margin-top:16px;background:linear-gradient(180deg,transparent 0 30%,#d6ecf1 30%);border:2px solid var(--ink-soft);border-radius:14px 14px 18px 18px;display:grid;place-items:center}
.glas::before{content:"";position:absolute;top:-16px;left:32%;width:36%;height:16px;border:2px solid var(--ink-soft);border-bottom:0;border-radius:4px 4px 0 0;background:var(--creme-tief)}
.glas b{font-weight:normal;font-size:19px;background:#fff;border:1px solid var(--ink);padding:2px 7px;border-radius:3px}

/* Dissoziation (Gleichungen) */
.diss{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;min-height:76px;padding:12px;background:var(--creme);border-radius:10px;font-size:20px}
.ion{border-radius:999px;padding:6px 12px;animation:pop .45s both}
.ion.h{background:#f6d6d1;color:#7a1f15} .ion.r{background:#cfe7ec;color:var(--petrol-tief)}
.wertig{text-align:center;font-family:var(--sans);font-size:14px;color:var(--ink-soft)}

/* Animationen */
.anim svg{width:100%;height:auto;display:block;background:#f4f9fa;border-radius:12px;border:1px solid var(--linie);max-width:100%}
.anim .schalter{justify-content:center}
.steuer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.schritte{display:flex;gap:6px;justify-content:center}
.schritte i{width:10px;height:10px;border-radius:50%;background:var(--creme-tief);border:1px solid var(--linie)}
.schritte i.an{background:var(--petrol);border-color:var(--petrol)}
.anim-text{min-height:5.2em;font-size:16px;background:var(--creme);border-radius:10px;padding:10px 12px}
.anim-text b{color:var(--petrol-tief)}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.legende span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c);border:1.5px solid var(--r,rgba(0,0,0,.15))}
.lbl{font-family:var(--sans);font-size:10px;fill:var(--ink-soft)}
.lbl.b{font-weight:600;fill:var(--ink);font-size:11px}
.lbl.atom{font-size:8px;fill:#1f4a1a}
.lbl.ladung{font-size:15px;font-weight:700}
.pf-lbl{font-family:var(--sans);font-size:9px;fill:var(--ink-soft);font-style:italic}
/* CO₂-Kreislauf */
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot.aktiv .hl,.hot:focus-visible .hl{stroke:var(--honig);stroke-width:3}
.pfeil{fill:none;stroke:#6A645B;stroke-width:1.6;stroke-dasharray:4 3}
.pfeil.rot{stroke:#B23B2E;stroke-width:2.2}
.teil{fill:#6A645B} .teil.rot{fill:#B23B2E}
svg .menschlich{opacity:0;transition:opacity .5s} svg.mitmensch .menschlich{opacity:1}
svg .fabrik{opacity:.35;transition:opacity .5s} svg.mitmensch .fabrik{opacity:1}
.bilanz{display:grid;gap:8px;font-size:16px}
.bbar{display:flex;min-height:26px;border-radius:6px;overflow:hidden;font-family:var(--sans);font-size:12px;color:#fff}
.bbar span{display:grid;place-items:center;padding:3px 6px;text-align:center}
/* Springbrunnen */
.gas{transition:opacity .6s}
.tropfen1 circle,.strahl circle{opacity:0}
svg[data-schritt="1"] .tropfen1 circle{animation:hoch 1.2s ease-in infinite}
@keyframes hoch{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-118px)}}
svg[data-schritt="3"] .strahl circle{animation:spritz .8s ease-out infinite}
@keyframes spritz{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-44px)}}
.luftdruck{opacity:0;transition:opacity .5s}
svg[data-schritt="2"] .luftdruck,svg[data-schritt="3"] .luftdruck{opacity:1}
.gas-lbl{transition:opacity .5s} svg[data-schritt="2"] .gas-lbl,svg[data-schritt="3"] .gas-lbl{opacity:0}
/* Teilchenmodell */
.cl,.ha{transition:transform 1.1s cubic-bezier(.4,.1,.3,1)}
.ox,.hydrat,.minus{opacity:0;transition:opacity .5s .9s}
svg[data-stufe="2"] .ox,svg[data-stufe="2"] .hydrat,svg[data-stufe="2"] .minus{opacity:1}
.lampe{fill:#e6e1d6;transition:fill .5s 1s}
svg[data-stufe="2"] .lampe{fill:#ffd54a}
.glow{transition:opacity .5s 1s}
svg[data-stufe="2"] .glow{opacity:.45}


/* Säuren I: Konzentration, Strom, Rotkohl */
.regler{width:100%;accent-color:var(--petrol);height:28px}
.konz-out{display:flex;gap:12px;align-items:center;border-radius:10px;padding:10px 12px;font-size:16px;min-height:78px}
.konz-out.k-ok{background:#e3f0e7} .konz-out.k-warn{background:#fbf1e2} .konz-out.k-gef{background:#f6e1de}
.konz-wert{color:var(--petrol-tief);font-weight:bold}
.anim svg.ghs,.ghs{width:56px;height:56px;flex:none;background:none;border:0;border-radius:0}
.chip:disabled{opacity:.45;cursor:default}
.stoffwahl,.rk-wahl{justify-content:center}
.si{animation:driftR 2.6s ease-in-out infinite alternate} .si.neg{animation-name:driftL}
@keyframes driftR{to{transform:translateX(14px)}} @keyframes driftL{to{transform:translateX(-14px)}}
.lbl.ion-t{fill:#fff;font-size:9px;font-weight:700}
.rk-saft{transition:fill 1.2s}
.rk-tropfen.faellt{animation:faellt .65s ease-in forwards}
@keyframes faellt{0%{transform:translateY(0);opacity:1}90%{opacity:1}100%{transform:translateY(64px);opacity:0}}
/* Laugen: Metall trifft Wasser, Neutralisation */
.fbalken.lauge i{background:linear-gradient(90deg,#5e2373,#3a54a6,#1f8c8a,#6fbf4a)}
.mw-zisch{opacity:0} .mw-zisch.an{opacity:1;animation:zisch .3s steps(2) infinite}
@keyframes zisch{50%{transform:translate(1.5px,-1.5px)}}
.mw-blasen circle{opacity:0}
.mw-blasen.an circle{animation:mwhoch 1.6s ease-in infinite}
.mw-blasen.langsam circle{animation-duration:3.8s}
.mw-blasen.langsam circle:nth-child(n+3){display:none}
@keyframes mwhoch{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}100%{opacity:0;transform:translateY(-74px)}}
.mw-gl{font-size:16px}
.t-fl{transition:fill .5s}
/* Salze */
.etikett{background:#fff;border:2px solid var(--petrol);border-radius:12px;padding:10px 12px;display:grid}
.etk-kopf{font-family:var(--sans);font-weight:600;color:var(--petrol-tief);border-bottom:2px solid var(--petrol);padding-bottom:6px;margin-bottom:2px;font-size:14px}
.etk-bsp{font-weight:normal;color:var(--ink-soft)}
.etk-zeile{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px dotted var(--linie);background:none;padding:8px 6px;font-size:15px;cursor:pointer;text-align:left;font-family:var(--serif);border-radius:6px;color:var(--ink)}

.etk-zeile.ok{background:#e3f0e7;color:var(--ok)}
.etk-zeile.anion{color:var(--ink-soft)}
.el-ladung,.el-anz{opacity:0;transition:opacity .5s .7s}

.na-aussen{transition:opacity .5s .7s}
svg[data-stufe="1"] .na-aussen,svg[data-stufe="2"] .na-aussen{opacity:0}
.el-na,.el-cl{transition:transform 1s ease}
svg[data-stufe="2"] .el-na{transform:translateX(28px)}
svg[data-stufe="2"] .el-cl{transform:translateX(-28px)}
.gitter-svg{touch-action:none;cursor:grab}
.sp-oben{transition:transform .6s ease}
.sp-abst{opacity:0;transition:opacity .4s}
svg.abst .sp-abst{opacity:1}
.li{transition:transform 1s ease}
.li-hyd{opacity:0;transition:opacity .5s}
svg[data-stufe="2"] .li-hyd{opacity:1}
.l-flamme{opacity:0;transition:opacity .4s}
svg[data-stufe="3"] .l-flamme{opacity:1}
.bk-reihe{display:grid;gap:6px}
.bk-lab{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.bk-out{background:var(--creme);border-radius:10px;padding:12px;display:grid;gap:6px;justify-items:center;text-align:center}
.bk-ionen{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ion-chip{border-radius:999px;padding:4px 10px;font-size:17px;animation:pop .4s both}
.ion-chip.k{background:#e3defa;color:#4b3f98} .ion-chip.a{background:#d9efd2;color:#2f6b24}
.bk-bilanz{font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.bk-name{font-size:22px;color:var(--petrol-tief)}
.bk-formel{font-size:24px}
/* Bindungen */
.bins.drei{grid-template-columns:repeat(3,1fr)}
.bin.m{border-color:#b9c3c7} .bin.m h4{color:#4f6066}
.tabwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0 14px;border:1px solid var(--linie);border-radius:10px}
.vergleich{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;background:var(--tile)}
.vergleich th,.vergleich td{padding:8px 10px;border-bottom:1px solid var(--linie);text-align:left;vertical-align:top}
.vergleich tr:last-child td{border-bottom:0}
.vergleich th{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--petrol-tief);background:var(--creme)}
.vergleich td:first-child{font-family:var(--sans);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.lewis-sym{font-family:var(--sans);font-size:28px;font-weight:600;fill:var(--ink)}
.lewis-sym.klein-sym{font-size:22px}
.p-el{transition:transform 1.2s cubic-bezier(.4,.1,.3,1)}
.p-ring{opacity:0;transition:opacity .5s 1s} svg.verbunden .p-ring{opacity:1}
.tz-paar{transition:transform 1.1s cubic-bezier(.4,.1,.3,1)}
.tz-delta{opacity:0;transition:opacity .4s .9s} .tz-delta.an{opacity:1}
.ballon-g{transition:transform 1s ease-in-out}
.ladungen{opacity:0;transition:opacity .4s} .geladen .ladungen{opacity:1}
.eg-oben{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.eg-pole{opacity:0;transition:opacity .4s} svg.strom .eg-pole{opacity:1}
@media (max-width:480px){.bins.drei{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.p-el,.tz-paar,.ballon-g,.eg-oben{transition:none}}
@media (max-width:480px){.glas b{font-size:15px} .slot{font-size:12px}}
@media (max-width:480px){.answers{grid-template-columns:1fr} body{font-size:17px} .bins{grid-template-columns:1fr}}

@media print{
  @page{size:A4 portrait;margin:12mm}

  .urkunde{box-shadow:none;max-width:none}
  .urk-btns,.urk-name{display:none!important}
  .urk-name-druck{display:block}

/* ============ Helfer ============ */
const $ = (s, el = document) => el.querySelector(s);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function tween(el, attr, to, dur) {

const PH = ["#d7263d","#e4402f","#ee6a2c","#f38b2c","#f6ad2e","#f2cf32","#c9d43a","#6fbf4a","#2fa46b","#1f8c8a","#2d6fae","#3a54a6","#4b3f98","#5a2f86","#5e2373"];

function clip(datei, titel, text) {

/* ============ Toast, Konfetti, Fanfare ============ */
let toastTimer;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("zeigen"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("zeigen"), 3200); }
function konfetti() {
  if (reduce) return;
  const f = document.createElement("div"); f.className = "konffeld";
  const farben = ["#2C7D90", "#C28A3A", "#d7263d", "#f6ad2e", "#6fbf4a", "#3a54a6", "#5a2f86"];
  for (let n = 0; n < 80; n++) {
    const k = document.createElement("span"); k.className = "konf";
    k.style.cssText = `left:${Math.random() * 100}%;background:${farben[(Math.random() * farben.length) | 0]};animation-delay:${(Math.random() * .6).toFixed(2)}s;transform:rotate(${Math.random() * 360}deg)`;
    f.appendChild(k);
  }
  document.body.appendChild(f); setTimeout(() => f.remove(), 4500);
}
function fanfare(gross) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); if (ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime + .05;
    const noten = gross
      ? [[392, 0, .14], [523.25, .14, .14], [659.25, .28, .14], [783.99, .42, .28], [659.25, .72, .14], [783.99, .86, .9]]

    noten.forEach(([fr, st, du]) => {
      [1, 2].forEach(oct => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = oct === 1 ? "triangle" : "sine"; o.frequency.value = fr * oct;
        const v = oct === 1 ? .2 : .05;

        o.connect(g); g.connect(ctx.destination); o.start(t0 + st); o.stop(t0 + st + du + .3);
      });
    });
    setTimeout(() => ctx.close(), 3000);
  } catch (e) {}
}

    <p>Genau genommen bleibt ein Wasserstoff-Ion in Wasser nie allein. Es hängt sich sofort an ein Wassermolekül. So entsteht das <b>Oxonium-Ion</b> H<sub>3</sub>O<sup>+</sup>.</p></div></details>`,

s1: () => `
  <div class="prose lead"><p>Wie macht man eigentlich eine Säure? Am Beispiel der Kohlensäure lässt sich das gut zeigen. Es braucht nur zwei Schritte.</p></div>

s2: () => `
  <div class="prose lead"><p>Kohlenstoffdioxid entsteht nicht nur im Labor. Es entsteht überall, wo etwas verbrennt – im Kraftwerk, im Automotor und sogar in deinem Körper.</p></div>
  <div class="prose"><p>Die Atmung ist nämlich eine „stille Verbrennung“ von Traubenzucker. Die Fotosynthese der Pflanzen läuft genau andersherum: Sie holt das CO<sub>2</sub> aus der Luft und baut daraus wieder Zucker.</p></div>
  <p class="eq">Traubenzucker + Sauerstoff → Kohlenstoffdioxid + Wasser</p>
  <div class="box anim" data-widget="co2"></div>
  <div class="gefahr"><b>Zu wenig Sauerstoff?</b> Dann entsteht statt Kohlenstoffdioxid das sehr giftige <b>Kohlenstoffmonoxid</b>: 2&nbsp;C + O<sub>2</sub> → 2&nbsp;CO. Deshalb nie einen Grill in geschlossenen Räumen betreiben!</div>

  <div class="prose">
    <p><b>Regen</b> ist von Natur aus leicht sauer (pH&nbsp;5,6), weil sich CO<sub>2</sub> aus der Luft darin löst. Kommen Schwefel- und Stickoxide aus Abgasen hinzu, entstehen Schwefelsäure und Salpetersäure: <b>saurer Regen</b>, der Wälder und Gewässer schädigt. Dank Filtern in Kraftwerken ist das Problem in Deutschland heute viel kleiner als in den 1980er-Jahren.</p>
    <p>Auch die <b>Meere</b> nehmen viel CO<sub>2</sub> auf und werden dadurch langsam saurer: Ihr pH-Wert ist seit 1850 von etwa 8,2 auf 8,1 gesunken. Klingt wenig – ist aber rund 30&nbsp;% mehr Wasserstoff-Ionen. Muscheln und Korallen fällt es dadurch schwerer, ihre Kalkschalen zu bauen.</p>
  </div>
  <p class="klein">Zahlen: Global Carbon Project 2024, Weltklimarat IPCC – gerundet.</p>`,

  </div>`,

s1: () => `
  <div class="prose lead"><p>Fast kein Atom bleibt gern allein. Warum eigentlich? Die Antwort steckt in der äußersten Elektronenschale.</p></div>
  <div class="prose"><p>Atome sind besonders stabil, wenn ihre <b>Außenschale voll</b> ist – meist mit 8 Elektronen, beim Wasserstoff mit 2. Die <b>Edelgase</b> wie Helium und Neon haben das von Natur aus. Alle anderen Atome versuchen, diesen Zustand zu erreichen: Sie geben Elektronen ab, nehmen welche auf – oder teilen sie sich.</p></div>

s2: () => `

  <div class="box anim" data-widget="molekuel"></div>
  <details><summary>Für Neugierige: Warum ist Wasser gewinkelt?</summary><div class="grid">
    <p>Die vier Elektronenpaare um das Sauerstoff-Atom stoßen sich ab und verteilen sich so weit wie möglich im Raum. Zwei davon sind Bindungen zu den H-Atomen, zwei sind freie Paare. Deshalb ist das Wassermolekül nicht gerade, sondern gewinkelt – mit einem Winkel von 104,5°.</p></div></details>`,
s3: () => `

  <div class="prose"><p>Wie stark ein Atom an den Bindungselektronen zieht, heißt <b>Elektronegativität</b> (kurz EN). Sauerstoff zieht sehr stark (3,5), Chlor stark (3,0), Wasserstoff schwach (2,1), Natrium kaum (0,9).</p></div>
  <div class="box anim" data-widget="tauziehen"></div>

/* ============ Quiz ============ */
function quiz(el, data, jokers, fertig) {
  let i = 0, score = 0, j50 = false, jpub = false; const marks = [];
  const qs = data.map(([q, a, hints]) => ({ q, hints, a: shuffle(a.map((t, k) => ({ t, ok: k === 0 }))) }));
  const zeichne = () => {
    if (i >= qs.length) return fertig(score, qs.length);
    const q = qs[i];
    el.innerHTML = `<div class="quiz">
      <div class="qhead"><span class="eyebrow">Frage ${i + 1} von ${qs.length}</span><div class="dots">${qs.map((_, k) => `<i class="${marks[k] || (k === i ? "now" : "")}"></i>`).join("")}</div></div>
      <p class="qq">${q.q}</p>
      <div class="answers">${q.a.map((a, k) => `<button type="button" class="ans" data-k="${k}"><b>${"ABCD"[k]}</b><span>${a.t}</span></button>`).join("")}</div>
      ${jokers ? `<div class="jokers"><button type="button" class="knopf" data-j="50" ${j50 ? "disabled" : ""}>50:50</button><button type="button" class="knopf" data-j="pub" ${jpub ? "disabled" : ""}>📣 Publikumsjoker</button></div>` : ""}
      <p class="publikum" hidden></p>
      <p class="feedback" aria-live="polite"></p>
      <div><button type="button" class="knopf prim" data-weiter hidden>${i + 1 < qs.length ? "Nächste Frage" : "Auswertung"}</button></div></div>`;
    $$(".ans", el).forEach(b => b.onclick = () => antwort(+b.dataset.k));
    const b50 = $('[data-j="50"]', el), bp = $('[data-j="pub"]', el);
    if (b50) b50.onclick = () => { j50 = true; b50.disabled = true;
      shuffle(q.a.map((a, k) => k).filter(k => !q.a[k].ok)).slice(0, 2).forEach(k => { $(`.ans[data-k="${k}"]`, el).hidden = true; }); };
    if (bp) bp.onclick = () => { jpub = true; bp.disabled = true; const p = $(".publikum", el); p.hidden = false;
      const r = Math.random(), h = q.hints[r < .45 ? 0 : r < .7 ? 1 : r < .88 ? 2 : 3];
      p.textContent = "„" + h.replace(/^([^:]+): /, "$1 ruft: ") + "“"; };
    $("[data-weiter]", el).onclick = () => { i++; zeichne(); };
  };
  const antwort = k => {
    const q = qs[i], ok = q.a[k].ok;
    $$(".ans", el).forEach(b => { b.disabled = true; if (q.a[+b.dataset.k].ok) b.classList.add("ok"); });
    if (!ok) $(`.ans[data-k="${k}"]`, el).classList.add("bad");
    $$("[data-j]", el).forEach(b => b.disabled = true);
    marks[i] = ok ? "ok" : "bad"; if (ok) score++;
    const fb = $(".feedback", el); fb.className = "feedback " + (ok ? "good" : "bad"); fb.textContent = ok ? "Richtig!" : "Leider falsch.";
    $("[data-weiter]", el).hidden = false; $("[data-weiter]", el).focus();
  };
  zeichne();
}

/* ============ Station abschließen ============ */
function abschliessen(eid, sid, score, total) {
  const X = EXPS[eid], n = X.stationen.length;
  const tropfen = total === 3 ? score : (score >= 7 ? 3 : score >= 5 ? 2 : score >= 3 ? 1 : 0);
  const vorher = kennzahlen(eid), rangVorher = rangIndex(eid, vorher.summe), alleVorher = vorher.fertige === n;
  const abzVorher = X.abzeichen.map(a => a.ok(vorher));
  const alt = S[eid][sid];
  S[eid][sid] = { done: true, tropfen: Math.max(tropfen, alt ? alt.tropfen || 0 : 0), ts: Date.now() };
  speichern();
  const nach = kennzahlen(eid), rangNach = rangIndex(eid, nach.summe);
  return { tropfen, best: S[eid][sid].tropfen, neuerRang: rangNach > rangVorher ? X.raenge[rangNach] : null,
    geschafft: !alleVorher && nach.fertige === n, neueAbz: X.abzeichen.filter((a, k) => !abzVorher[k] && a.ok(nach)) };
}

  <div><a href="https://mibaso.de" target="_blank" rel="noopener">⌂ Alle Mibaso-Apps</a> · <a href="#ueber">Über mich</a> · <a href="#impressum">Impressum &amp; Datenschutz</a></div>
  <div>© 2026 Michael Baur · Chemie Mibaso</div></footer>`;

  const kachel = (eid, unter) => { const X = EXPS[eid], h = kennzahlen(eid);
    return `<a class="kachel" href="#${eid}"><span class="ke">${X.em}</span><span><span class="kt">Expedition ${X.titel}</span><span class="kb">${X.motto} · 5 Stationen · ca. 40 Min · 💧 ${h.summe}/${MAXT(eid)}</span></span><span class="pf">›</span></a>`; };
  app.innerHTML = `${kopf("Chemie Mibaso", "Chemie zum Anfassen – Lernpfade mit Versuchen, Rätseln und Urkunde")}
  <div class="huelle">
    <section>
      <p class="lead">Wähle eine Expedition. Jede dauert etwa eine Schulstunde. Für jede Station gibt es bis zu drei Tropfen – füll deinen Kolben und hol dir die Urkunde!</p>
    </section>
    <section>
      <h2 class="h-petrol">Kapitel 1 · Säuren</h2>
      <div class="kacheln">${kachel("e1")}${kachel("e2")}</div>
    </section>
    <section>
      <h2 class="h-honig">Kapitel 2 · Laugen</h2>
      <div class="kacheln">${kachel("e3")}</div>
    </section>
    <section>
      <h2 class="h-petrol">Kapitel 3 · Salze</h2>
      <div class="kacheln">${kachel("e4")}</div>
    </section>
    <section>
      <h2 class="h-honig">Kapitel 4 · Bindungen</h2>
      <div class="kacheln">${kachel("e5")}</div>
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in der Vertretungsstunde</summary><div class="grid">
        <p>Jede Expedition passt in eine Schulstunde (ca. 40 Minuten). Sie läuft im Browser auf Tablet, Handy oder Computer – ohne Anmeldung und ohne Datensammlung. Die Expeditionen bauen aufeinander auf (Säuren I, Säuren II, Laugen, Salze, Bindungen), lassen sich aber auch einzeln einsetzen.</p>
        <ul class="clean">
          <li><b>Ruhig im Klassenraum:</b> Die Versuchsfilme laufen als kurze Filmszenen ohne Ton. Nur bei voller Punktzahl erklingt eine kurze Fanfare.</li>
          <li><b>Stufenweise:</b> Jede Station öffnet sich erst, wenn die vorige geschafft ist. Mit „Alle offen“ kann frei gewählt werden.</li>

}

function seitePass(eid) {
  const X = EXPS[eid], MAX = MAXT(eid), h = kennzahlen(eid), ri = rangIndex(eid, h.summe), rang = X.raenge[ri], next = X.raenge[ri + 1], n = X.stationen.length;
  app.innerHTML = `
  <div class="subkopf"><div class="row"><a class="zurueck" href="#start">‹ Chemie Mibaso</a><span class="tchip">💧 ${h.summe} / ${MAX}</span></div></div>
  <div class="huelle">
    <section>
      <span class="eyebrow">Dein Laborpass</span>
      <h2 class="h-petrol">Expedition ${X.titel}</h2>
      <p class="lead">${X.lead}</p>
      <div class="buehne">
        <div class="rangchip"><span class="med">${rang.med}</span><span>Rang<b>${rang.name}</b></span></div>
        <div class="zaehler">${h.summe} / ${MAX} 💧</div>
        ${kolbenSVG(h.summe, MAX, X.kolben)}
        <div class="tisch"></div>
      </div>
      <div class="fbalken ${X.kolben === "lauge" ? "lauge" : ""}"><i id="fbar"></i></div>
      <p class="naechster">${next ? `Noch <b>${next.ab - h.summe} Tropfen</b> bis zum Rang „${next.name}“` : `Höchster Rang erreicht – ${rang.name}! 🎉`}</p>
      <div class="schalter"><span class="lab">Spielmodus:</span>
        <button type="button" class="sbtn ${S.modus === "frei" ? "an" : ""}" data-m="frei">🔓 Alle offen</button>
        <button type="button" class="sbtn ${S.modus === "level" ? "an" : ""}" data-m="level">🔒 Stufenweise</button></div>
    </section>
    <section>
      <h2 class="h-honig">Deine Stationen</h2>
      <div class="stationen">${X.stationen.map((s, k) => {
        const e = h.d[s.id], done = !!(e && e.done), vor = k === 0 || !!(h.d[X.stationen[k - 1].id] && h.d[X.stationen[k - 1].id].done);
        const offen = S.modus === "frei" || done || vor;
        const cls = done ? "fertig" : offen ? "aktiv" : "gesperrt";
        const rechts = done ? tropfenHTML(e.tropfen) : offen ? `ca. ${s.min} Min ›` : "🔒";
        const inner = `<span class="nr">${s.em}</span><span><span class="st">${k + 1}. ${s.titel}</span><span class="sk">${s.kurz}</span></span><span class="stand">${rechts}</span>`;
        return offen ? `<a class="station ${cls}" href="#${eid}-${s.id}">${inner}</a>` : `<div class="station ${cls}" aria-disabled="true">${inner}</div>`;
      }).join("")}</div>
    </section>
    <section>
      <h2 class="h-petrol">Urkunde</h2>
      ${h.fertige ? `<p>${h.fertige === n ? "Geschafft! Trag deinen Namen ein und hol dir deine Urkunde." : `Du hast ${h.fertige} von ${n} Stationen geschafft. Die Urkunde zeigt deinen Zwischenstand.`}</p>
        <div><button type="button" class="knopf honig" id="urkBtn">📜 Urkunde ansehen</button></div>`
        : `<p class="klein">Schaff die erste Station – dann gibt es hier deine Urkunde.</p>`}
    </section>
    <section>
      <h2 class="h-honig">Abzeichen-Album</h2>
      <div class="album">${X.abzeichen.map(a => { const ok = a.ok(h); return `<div class="abz ${ok ? "auf" : "zu"}"><span class="em">${a.em}</span>${a.name}</div>`; }).join("")}</div>
    </section>
    <section class="reset" id="resetBox">
      <button type="button" class="knopf" id="resetBtn">Pass zurücksetzen</button>
      <p class="hint">Löscht Tropfen und Abzeichen dieser Expedition auf diesem Gerät – zum Beispiel für die nächste Person.</p>
    </section>
    ${fuss()}
  </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = $("#fbar"); if (b) b.style.width = (h.summe / MAX * 100) + "%"; }));
  $$("[data-m]", app).forEach(b => b.onclick = () => { S.modus = b.dataset.m; speichern(); route(true); });
  const ub = $("#urkBtn"); if (ub) ub.onclick = () => urkunde(eid);
  $("#resetBtn").onclick = () => {
    $("#resetBox").innerHTML = `<p><b>Wirklich alles löschen?</b> Tropfen, Abzeichen und Name auf diesem Gerät sind dann weg.</p>
      <div class="knopfreihe"><button type="button" class="knopf prim" id="jaReset">Ja, zurücksetzen</button><button type="button" class="knopf" id="neinReset">Abbrechen</button></div>`;
    $("#jaReset").onclick = () => { S[eid] = {}; S.name = ""; speichern(); toast("Laborpass zurückgesetzt."); route(true); };
    $("#neinReset").onclick = () => route(true);
  };
}

function seiteStation(eid, sid) {
  const X = EXPS[eid], MAX = MAXT(eid), k = X.stationen.findIndex(s => s.id === sid), s = X.stationen[k], h = kennzahlen(eid);
  const vor = k === 0 || !!(h.d[X.stationen[k - 1].id] && h.d[X.stationen[k - 1].id].done);
  if (S.modus === "level" && !vor && !(h.d[sid] && h.d[sid].done)) { location.hash = eid; return; }
  const finale = sid === "s5";
  app.innerHTML = `
  <div class="subkopf"><div class="row"><a class="zurueck" href="#${eid}">‹ Laborpass ${X.titel}</a><span class="tchip" id="tchip">💧 ${h.summe} / ${MAX}</span></div></div>
  <div class="huelle">
    <section>
      <span class="eyebrow">${X.titel} · Station ${k + 1} von ${X.stationen.length} · ca. ${s.min} Min</span>
      <h2 class="h-petrol">${s.em} ${s.titel}</h2>
      ${X.inhalt[sid]()}
    </section>
    <section>
      <h2 class="h-honig">${finale ? "Los geht’s!" : "Station-Check"}</h2>
      ${finale ? "" : `<p class="klein">Drei Fragen – für jede richtige Antwort gibt es einen Tropfen.</p>`}
      <div class="box" id="check"></div>
    </section>
    ${fuss()}
  </div>`;
  $$("[data-widget]", app).forEach(el => WIDGETS[el.dataset.widget](el));
  if (!reduce) $$(".clip-v video", app).forEach(v => { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); });
  const box = $("#check");
  const starte = () => quiz(box, finale ? X.profi : X.checks[sid], finale, (score, total) => {
    const r = abschliessen(eid, sid, score, total), naechste = X.stationen[k + 1];
    $("#tchip").textContent = `💧 ${kennzahlen(eid).summe} / ${MAX}`;
    const lob = r.tropfen === 3 ? "Volle Punktzahl – stark!" : r.tropfen === 2 ? "Gut gemacht!" : r.tropfen === 1 ? "Geschafft! Mit einem zweiten Versuch holst du mehr Tropfen." : "Station erledigt – aber probier’s gleich noch mal!";
    box.innerHTML = `<div class="ergebnis">
      <span class="eyebrow">${score} von ${total} richtig</span>
      <div class="gross">${tropfenHTML(r.tropfen)}</div>
      <p>${lob}</p>
      ${r.best > r.tropfen ? `<p class="klein">In deinem Pass zählt dein bestes Ergebnis: ${r.best} Tropfen.</p>` : ""}
      <div class="knopfreihe">
        <button type="button" class="knopf" id="nochmal">Nochmal</button>
        ${naechste ? `<a class="knopf prim" href="#${eid}-${naechste.id}">Weiter: ${naechste.titel} ›</a>` : ""}
        <a class="knopf ${naechste ? "" : "prim"}" href="#${eid}">💧 Zum Laborpass</a>
      </div></div>`;
    $("#nochmal").onclick = starte;
    if (r.geschafft) feier(eid);
    else {
      if (r.tropfen === 3) { konfetti(); fanfare(false); }
      if (r.neuerRang) setTimeout(() => toast(`${r.neuerRang.med} Neuer Rang: ${r.neuerRang.name}!`), 600);
      else if (r.neueAbz.length) setTimeout(() => toast(`${r.neueAbz[0].em} Neues Abzeichen: ${r.neueAbz[0].name}`), 600);
    }
  });
  starte();
}

/* ============ Feier & Urkunde ============ */
function feier(eid) {
  konfetti(); fanfare(true);
  const X = EXPS[eid], h = kennzahlen(eid), rang = X.raenge[rangIndex(eid, h.summe)];
  const o = document.createElement("div"); o.className = "overlay"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
  o.innerHTML = `<div class="feierkarte"><div class="fmed">${rang.med}</div><h3>Expedition geschafft!</h3>
    <p>Du hast alle Stationen von „${X.titel}“ gemeistert und ${h.summe} von ${MAXT(eid)} Tropfen gesammelt. Dein Rang: <b>${rang.name}</b>.</p>
    <div class="knopfreihe"><button type="button" class="knopf honig" id="fUrk">📜 Zur Urkunde</button><button type="button" class="knopf" id="fZu">Weiter</button></div></div>`;
  document.body.appendChild(o);
  $("#fUrk", o).onclick = () => { o.remove(); urkunde(eid); };
  $("#fZu", o).onclick = () => o.remove();
  $("#fUrk", o).focus();
}

function urkunde(eid) {
  const X = EXPS[eid], h = kennzahlen(eid), rang = X.raenge[rangIndex(eid, h.summe)], n = X.stationen.length, alle = h.fertige === n;
  const datum = new Date().toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
  const abz = X.abzeichen.filter(a => a.ok(h)).map(a => a.em).join(" ");
  const titel = `„${X.titel} – ${X.motto}“`;
  const o = document.createElement("div"); o.className = "overlay"; o.id = "urkunde"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
  o.innerHTML = `<div class="urkunde"><div class="rahmen">
    <div class="urk-eyebrow">Chemie Mibaso · Laborpass</div>
    <div class="urk-med">${rang.med}</div>
    <div class="urk-titel">Urkunde</div>
    <div class="urk-sub">${rang.name}</div>
    <div class="urk-satz">Diese Urkunde bestätigt, dass</div>
    <input class="urk-name" id="urkName" placeholder="Dein Name" aria-label="Dein Name" value="${esc(S.name || "")}">
    <div class="urk-name-druck" id="urkNameDruck">${S.name ? esc(S.name) : "&nbsp;"}</div>
    <div class="urk-satz">${alle ? `die Expedition <b>${titel}</b> erfolgreich abgeschlossen hat.` : `in der Expedition <b>${titel}</b> ${h.fertige} von ${n} Stationen gemeistert hat.`}</div>
    <table class="urk-tab">${X.stationen.map((s, k) => { const e = h.d[s.id]; return `<tr><td>${k + 1}. ${s.titel}</td><td>${e && e.done ? tropfenHTML(e.tropfen) : "–"}</td></tr>`; }).join("")}</table>
    <div class="urk-summe">💧 ${h.summe} von ${MAXT(eid)} Tropfen</div>
    ${abz ? `<div class="urk-album" aria-label="Abzeichen">${abz}</div>` : ""}
    <div class="urk-fuss"><span>${datum}</span><span>Chemie Mibaso · mibaso.de</span></div>
  </div>
  <div class="urk-btns">
    ${IM_RAHMEN ? `<span class="hint">Drucken klappt in der fertigen App auf mibaso.de.</span>` : `<button type="button" class="knopf prim" id="urkDruck">🖨️ Drucken / als PDF sichern</button>`}
    <button type="button" class="knopf" id="urkZu">Schließen</button>
  </div></div>`;
  document.body.appendChild(o);
  const inp = $("#urkName", o);
  inp.oninput = () => { S.name = inp.value.slice(0, 60); speichern(); $("#urkNameDruck", o).textContent = S.name || " "; };
  const d = $("#urkDruck", o); if (d) d.onclick = () => window.print();
  $("#urkZu", o).onclick = () => o.remove();
  o.onclick = e => { if (e.target === o) o.remove(); };
  if (!S.name) inp.focus();
}

/* ============ Navigation ============ */
function route(behalteScroll) {
  $$(".overlay").forEach(o => o.remove());
  const h = location.hash.slice(1), m = h.match(/^(e[1-5])-(s[1-5])$/);
  if (EXPS[h]) seitePass(h);
  else if (m) seiteStation(m[1], m[2]);
  else if (h === "ueber") seiteUeber();
  else if (h === "impressum") seiteImpressum();
  else seiteStart();
  if (behalteScroll !== true) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => route());
route();

if ("serviceWorker" in navigator && location.protocol === "https:" && !IM_RAHMEN) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
